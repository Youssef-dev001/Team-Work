<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الدخول — Flow</title>
<meta name="theme-color" content="#0b0a09">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/thmanyahserifdisplay-Regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="fonts/thmanyahserifdisplay-Bold.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="mk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e1b3"/><stop offset="1" stop-color="#c29c52"/></linearGradient>
  <linearGradient id="fl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8c987" stop-opacity="0"/><stop offset=".5" stop-color="#e8c987"/><stop offset="1" stop-color="#e8c987" stop-opacity="0"/></linearGradient>
  <symbol id="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="10" fill="url(#mk)"/><path d="M7 21c5 0 5-10 9-10s4 10 9 10" fill="none" stroke="#1b1306" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<main class="login">

  <section class="form-side">
    <a class="back" href="index.html"><svg><use href="#arrow"/></svg>الرئيسية</a>

    <div class="auth-card">
      <a class="brand" href="index.html" aria-label="Flow"><svg class="mark"><use href="#mark"/></svg><span>Flow</span></a>

      <span class="kicker">Team access</span>
      <h1>تسجيل الدخول</h1>
      <p class="sub">ادخل بيانات حسابك للوصول إلى لوحة المتابعة.</p>

      <form id="login-form">
        <label>
          اسم المستخدم
          <input id="username" type="text" autocomplete="username" placeholder="Your Name" required>
        </label>

        <label>
          كلمة المرور
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </label>

        <button type="submit" class="btn btn-primary btn-block">دخول</button>

        <p id="login-error" class="error-message" role="alert"></p>
      </form>
    </div>

    <small class="legal">معمول عشان شغلك يبقى أسهل وأوضح.</small>
  </section>

  <aside class="art-side" aria-hidden="true">
    <svg class="lines" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice">
      <path class="fp" d="M-20 700C140 700 160 380 320 400S520 760 640 640"/>
      <path class="fp f2" d="M-20 800C170 820 230 520 380 540S540 860 640 760"/>
      <path class="fp f3" d="M-20 600C120 580 220 280 360 300S560 520 640 420"/>
    </svg>
    <div class="art-copy">
      <span class="kicker">Work, composed</span>
      <p class="big">شغلك كله<br><em>قدامك</em>، وبترتيب.</p>
      <ul><li>مهام بتفاصيلها</li><li>مواعيد واضحة</li><li>ملفات وروابط في مكانها</li></ul>
    </div>
  </aside>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

    <script>
        const loginForm = document.getElementById("login-form");
        const loginError = document.getElementById("login-error");
        const loginButton = loginForm.querySelector("button");

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const username = document
                .getElementById("username")
                .value
                .trim();

            const password = document
                .getElementById("password")
                .value;

            loginError.textContent = "";
            loginButton.disabled = true;
            loginButton.textContent = "جاري تسجيل الدخول...";

            try {
                await login(username, password);
            } catch (error) {
                console.error(error);

                loginError.textContent =
                    "اسم المستخدم أو كلمة المرور غير صحيحة.";

                loginButton.disabled = false;
                loginButton.textContent = "دخول";
            }
        });
    </script>
</body>
</html>
